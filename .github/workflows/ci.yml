name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: "17 13 * * 1"   # weekly: catch newly published vulnerabilities in dependencies
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests scripts
      - run: pytest -q
      - name: Simulated quarter
        run: agent-checkpoint simulate --seeds 10
      - name: MCP smoke test
        run: |
          agent-checkpoint --home /tmp/cp demo > /tmp/demo.json
          KEY=$(python -c "import json; print(json.load(open('/tmp/demo.json'))['agent_key'])")
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18"}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | CHECKPOINT_AGENT_KEY=$KEY agent-checkpoint --home /tmp/cp mcp | tee /tmp/out.jsonl
          grep -q pay_invoice /tmp/out.jsonl

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]" playwright
      - run: python -m playwright install --with-deps chromium
      - run: pytest -q tests/test_e2e_browser.py
      - name: Demo builds
        run: python scripts/build_demo.py --out dist/demo

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pip-audit
      - name: Known vulnerabilities in dependencies
        run: pip-audit --strict .

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # scan the whole history, not just the latest commit
      - name: Gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .
